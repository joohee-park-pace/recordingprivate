            type: date
          - name: meta
            label: 정보 (화면에 표시 · 예 청동, 강철 · 2024)
            type: string
          - name: medium
            label: 재료 / 매체
            type: string
          - name: description
            label: 설명
            type: text
          - name: video
            label: 영상 링크 (유튜브 · 비메오 URL · 없으면 비워두기)
            type: string
          - name: cover
            label: 포스터 (목록 썸네일에 보임)
            type: image
          - name: main
            label: 메인 이미지 (상세페이지 큰 사진)
            type: image
          - name: images
            label: 세부 이미지 (상세 갤러리) — 여러 장 가능
            type: image
            list: true

