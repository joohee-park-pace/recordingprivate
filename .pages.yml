            type: string
          - name: cover
            label: 포스터 (목록 썸네일에 보임)
            type: image
          - name: main
            label: 메인 이미지 (상세페이지 큰 사진)
            type: image
          - name: images
            label: 세부 이미지 (상세 갤러리) — 여러 장 가능
            type: image
