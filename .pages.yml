            type: image
          - name: images
            label: 세부 이미지 (상세 갤러리) — 여러 장 가능
            type: image
            list: true

  - name: press
    label: Press (기사)
    type: file
    path: content/press.json
    fields:
      - name: items
        label: 기사 목록
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{source} — {title}'
        fields:
          - name: year
            label: 연도
            type: number
          - name: source
            label: 매체 (신문 · 매거진 이름)
            type: string
          - name: title
            label: 기사 제목
            type: string
          - name: url
            label: 링크 (기사 주소 URL)
            type: string
