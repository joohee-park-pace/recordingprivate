media:
  input: images
  output: /images

content:
  - name: site
    label: 사이트 기본 설정
    type: file
    path: content/site.json
    fields:
      - name: brandName
        label: 이름 (한글)
        type: string
      - name: brandSub
        label: 이름 밑 문구 (영문)
        type: string
      - name: heroTitle
        label: 홈 대문 큰 문구
        type: string
      - name: heroSubKo
        label: 홈 대문 설명 (국문)
        type: text
      - name: heroSubEn
        label: 홈 대문 설명 (영문)
        type: text
      - name: aboutParas
        label: 소개(About) 문단 — 여러 개 가능
        type: text
        list: true
      - name: aboutEn
        label: 소개 영문
        type: text
      - name: education
        label: 학력 (Education)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{year} · {text}'
        fields:
          - name: year
            label: 연도
            type: string
          - name: text
            label: 내용
            type: string
      - name: career
        label: 경력 (Career · 일)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{year} · {text}'
        fields:
          - name: year
            label: 연도 (또는 기간)
            type: string
          - name: text
            label: 내용 (직함 · 기관 등)
            type: string
      - name: email
        label: 이메일
        type: string
      - name: web
        label: 웹 주소
        type: string
      - name: instagram
        label: 인스타그램 아이디 (비우면 예시로 표시)
        type: string
      - name: studio
        label: 작업실 지역 (비우면 예시로 표시)
        type: string
      - name: notice
        label: 상단 안내 문구 (비우면 숨김)
        type: string

  - name: works_solo
    label: 작가 · 개인전
    type: file
    path: content/works-solo.json
    fields:
      - name: items
        label: 개인전 목록
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: title
            label: 제목
            type: string
          - name: date
            label: 날짜 (이 순서대로 자동 정렬됩니다)
            type: date
          - name: meta
            label: 정보 (화면에 표시 · 예 ○○ 갤러리, 서울 · 2025)
            type: string
          - name: medium
            label: 재료 / 매체
            type: string
          - name: description
            label: 설명 (전시 서문 · 작가노트)
            type: text
          - name: video
            label: 영상 링크 (유튜브 · 비메오 URL · 없으면 비워두기)
            type: string
          - name: cover
            label: 포스터 (목록 썸네일에 보임)
            type: image
          - name: main
            label: 메인 이미지 (상세페이지 큰 사진)
            type: image
          - name: images
            label: 세부 이미지 (상세 갤러리) — 여러 장 가능
            type: image
            list: true

  - name: works_group
    label: 작가 · 단체전
    type: file
    path: content/works-group.json
    fields:
      - name: items
        label: 단체전 목록
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: title
            label: 제목
            type: string
          - name: date
            label: 날짜 (이 순서대로 자동 정렬됩니다)
            type: date
          - name: meta
            label: 정보 (화면에 표시 · 예 ○○ 비엔날레 · 2024)
            type: string
          - name: medium
            label: 재료 / 매체
            type: string
          - name: description
            label: 설명
            type: text
          - name: video
            label: 영상 링크 (유튜브 · 비메오 URL · 없으면 비워두기)
            type: string
          - name: cover
            label: 포스터 (목록 썸네일에 보임)
            type: image
          - name: main
            label: 메인 이미지 (상세페이지 큰 사진)
            type: image
          - name: images
            label: 세부 이미지 (상세 갤러리) — 여러 장 가능
            type: image
            list: true

