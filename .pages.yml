        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: title
            label: 제목
            type: string
          - name: date
            label: 날짜 (이 순서대로 자동 정렬됩니다)
            type: date
          - name: meta
            label: 정보 (화면에 표시)
            type: string
          - name: role
            label: 역할 (공동작업 · 공동기획 등)
            type: string
          - name: description
            label: 설명
            type: text
          - name: video
            label: 영상 링크 (유튜브 · 비메오 URL · 없으면 비워두기)
            type: string
          - name: cover
            label: 포스터 (목록 썸네일에 보임)
            type: image
          - name: main
